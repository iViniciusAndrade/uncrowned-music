name: Gerar EXE (PC)
on:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Proteger o código (embaralha antes de empacotar)
        shell: bash
        run: |
          O="--compact true --string-array true --string-array-encoding base64 --string-array-threshold 0.6 --rename-globals false --self-defending false --control-flow-flattening false"
          npx --yes javascript-obfuscator@4.1.1 main.js --output main.js $O --target node
          npx --yes javascript-obfuscator@4.1.1 preload.js --output preload.js $O --target node
          npx --yes javascript-obfuscator@4.1.1 renderer/app.js --output renderer/app.js $O --target browser
      - name: Build
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          npx electron-builder --win nsis portable --publish never 2>&1 | tee build.log || { tail -n 40 build.log | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-${{ github.run_number }}
          name: Uncrowned Music para PC (build ${{ github.run_number }})
          body: |
            **UncrownedMusic-Setup.exe** — instalador (cria atalho na área de trabalho)
            **UncrownedMusic-Portable.exe** — roda direto, sem instalar
          make_latest: false
          files: |
            desktop/dist/UncrownedMusic-Setup.exe
            desktop/dist/UncrownedMusic-Portable.exe
