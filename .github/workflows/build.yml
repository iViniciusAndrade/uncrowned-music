name: Gerar APK
on:
  push:
    paths-ignore: ["desktop/**", ".github/workflows/desktop.yml", "ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Chave de assinatura (se cadastrada)
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/release.jks; echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV; echo "Assinando com a chave própria"; else echo "Sem chave própria: usando a de teste"; fi
      - run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      - run: cp app/build/outputs/apk/release/app-release.apk UncrownedMusic.apk
      - name: O que mudou (aparece no aviso de atualização do app)
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n' "$MSG" | grep -viE '^(co-authored-by|claude-session):' > release-notes.md || true
          [ -s release-notes.md ] || echo "Melhorias e correções" > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: UncrownedMusic-apk
          path: UncrownedMusic.apk
      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Uncrowned Music (build ${{ github.run_number }})
          body_path: release-notes.md
          make_latest: true
          files: UncrownedMusic.apk
