name: Gerar IPA (iPhone)
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (sem assinatura: o Sideloadly/AltStore assina com o seu Apple ID)
        run: |
          set -o pipefail
          xcodebuild -project Uncrowned.xcodeproj -scheme Uncrowned -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build UNC_BUILD=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -E "error:" build.log | sort -u | head -80 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Monta o .ipa
        run: |
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/Uncrowned.app Payload/
          zip -qry ../UncrownedMusic.ipa Payload
      - name: O que mudou
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n' "$MSG" | grep -viE '^(co-authored-by|claude-session):' > ../release-notes.md || true
          [ -s ../release-notes.md ] || echo "Melhorias e correções" > ../release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: Uncrowned Music para iPhone (build ${{ github.run_number }})
          body_path: release-notes.md
          make_latest: false
          files: UncrownedMusic.ipa
